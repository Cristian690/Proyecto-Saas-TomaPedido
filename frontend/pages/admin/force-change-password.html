<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrdenFlash - Actualizá tu contraseña</title>
    <link rel="stylesheet" href="../../style.css?v=29">
</head>
<body>
    <header class="admin-header">
        <h1>OrdenFlash</h1>
        <span>Seguridad de la cuenta</span>
    </header>

    <main class="admin-container forced-password-page">
        <section class="admin-content">
            <section class="account-panel" aria-labelledby="force-password-title">
                <div class="account-panel__heading">
                    <h2 id="force-password-title">Actualizá tu contraseña</h2>
                    <p>Tu contraseña es temporal. Para continuar, elegí una nueva de entre 8 y 72 caracteres.</p>
                </div>

                <form id="change-password-form" novalidate>
                    <label>
                        Contraseña temporal
                        <input type="password" id="current-password" autocomplete="current-password" maxlength="72" required>
                    </label>
                    <label>
                        Nueva contraseña
                        <input type="password" id="new-password" autocomplete="new-password" minlength="8" maxlength="72" required>
                    </label>
                    <label>
                        Confirmar nueva contraseña
                        <input type="password" id="confirm-new-password" autocomplete="new-password" minlength="8" maxlength="72" required>
                    </label>

                    <p id="change-password-message" class="account-panel__message" role="alert" hidden></p>
                    <button type="submit" id="change-password-submit">Actualizar contraseña</button>
                </form>
            </section>
        </section>
    </main>

    <script type="module" src="../../js/admin/force-change-password.js?v=1.0"></script>
</body>
</html>
