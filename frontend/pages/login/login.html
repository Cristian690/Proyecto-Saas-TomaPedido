<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TomaPedido - Iniciar sesión</title>

    <link rel="stylesheet" href="../../style.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <h1>TomaPedido</h1>
            <p>Ingresá a tu panel de administración</p>

            <form id="login-form">

                <label>
                    Teléfono
                    <input
                        type="text"
                        id="login-phone"
                        placeholder="Ej: 1177776666"
                        required
                    >
                </label>

                <label>
                    Contraseña
                    <input
                        type="password"
                        id="login-password"
                        placeholder="Tu contraseña"
                        required
                    >
                </label>

                <button type="submit">
                    Iniciar sesión
                </button>

                <p id="login-error"></p>

            </form>

        </section>

    </main>

    <script type="module" src="../../js/auth/login.js"></script>

</body>

</html>
