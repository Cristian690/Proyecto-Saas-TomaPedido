<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrdenFlash - Categorías</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css?v=18">
</head>
<body>
    <main class="onboarding-container">
        <section class="onboarding-card onboarding-categories-card">
            <h1>OrdenFlash</h1>
            <p class="onboarding-progress">Paso 2 de 3</p>
            <h2>Elegí tus categorías</h2>
            <p id="onboarding-categories-description">
                Seleccioná las categorías que querés mostrar en tu tienda. Podés cambiarlas después.
            </p>

            <div id="onboarding-category-options" class="onboarding-category-options"></div>

            <div class="onboarding-custom-category">
                <label for="onboarding-custom-category-name">Agregar una categoría</label>
                <div class="onboarding-custom-category-row">
                    <input
                        type="text"
                        id="onboarding-custom-category-name"
                        maxlength="60"
                        placeholder="Ej: Productos especiales"
                    >
                    <button type="button" id="btn-add-onboarding-category">Agregar</button>
                </div>
            </div>

            <div class="onboarding-actions">
                <button type="button" id="btn-back" class="btn-secondary">Atrás</button>
                <button type="button" id="btn-finish-categories" class="btn-primary">Continuar</button>
            </div>

            <p id="onboarding-error"></p>
        </section>
    </main>

    <script type="module" src="../../js/onboarding/onboarding-categories.js?v=1.2"></script>
</body>
</html>
