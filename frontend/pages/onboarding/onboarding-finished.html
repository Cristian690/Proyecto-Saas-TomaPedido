<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OrdenFlash - Página lista</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../style.css">
</head>

<body>

    <main class="onboarding-container">

        <section class="onboarding-card">

            <h1>OrdenFlash</h1>

            <h2>🎉 ¡Tu página está lista!</h2>

            <p class="finished-message">
                Ya podés empezar a recibir pedidos de tus clientes.
            </p>

            <div id="finished-business">

                <img
                    id="finished-logo"
                    src=""
                    alt="Logo de tu negocio"
                    class="preview-logo"
                >

                <h3 id="finished-business-name">
                    Tu negocio
                </h3>

            </div>

            <div class="finished-actions">

                <button
                    type="button"
                    id="btn-view-page"
                    class="btn-primary"
                >
                    Ver mi página pública
                </button>

                <button
                    type="button"
                    id="btn-admin"
                    class="btn-secondary"
                >
                    Ir al panel de administración
                </button>

            </div>

        </section>

    </main>

    <script
        type="module"
        src="../../js/onboarding/onboarding-finished.js?v=1.1">
    </script>

</body>

</html>
