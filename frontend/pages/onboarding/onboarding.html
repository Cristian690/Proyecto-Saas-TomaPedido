<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OrdenFlash - Configuración</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../style.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <h1>OrdenFlash</h1>

            <p class="onboarding-step">
                Paso 1 de 2
            </p>

            <h2>
                <span class="onboarding-icon">📷</span>
                Agregá tu logo
            </h2>

            <label for="business-logo" class="file-button">
                Seleccionar archivo
            </label>

            <input
                type="file"
                id="business-logo"
                accept="image/jpeg,image/png,image/webp"
                hidden
            >

            <img
                id="logo-preview"
                src=""
                alt="Vista previa del logo"
                style="display: none;"
            >

            <hr class="onboarding-divider">

            <h2>
                <span class="onboarding-icon">🖼️</span>
                Agregá una imagen de portada
            </h2>

            <label for="business-cover" class="file-button">
                Seleccionar archivo
            </label>

            <input
                type="file"
                id="business-cover"
                accept="image/jpeg,image/png,image/webp"
                hidden
            >

            <img
                id="cover-preview"
                src=""
                alt="Vista previa de la portada"
                style="display: none;"
            >

            <hr class="onboarding-divider">

            <button type="button" id="btn-next">
                Continuar
            </button>

            <p>
                <button type="button" id="skip-logo">
                    Omitir por ahora
                </button>
            </p>

            <p id="onboarding-error"></p>

        </section>

    </main>

    <script type="module" src="../../js/onboarding/onboarding.js?v=1.1"></script>

</body>

</html>
