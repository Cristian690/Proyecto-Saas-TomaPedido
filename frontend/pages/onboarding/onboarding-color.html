<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TomaPedido - Personalización</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../style.css">
</head>

<body>

    <main class="onboarding-container">

        <section class="onboarding-card">

            <h1>TomaPedido</h1>

            <p class="onboarding-progress">
                Paso 2 de 2
            </p>

            <h2>Elegí el color de tu página</h2>

            <div class="color-selector">

                <div class="color-option">
                    <label for="business-background-color">
                        Color de fondo
                    </label>

                    <input
                        type="color"
                        id="business-background-color"
                        value="#ffffff"
                    >
                </div>

                <div class="color-option">
                    <label for="business-primary-color">
                        Color de botones
                    </label>

                    <input
                        type="color"
                        id="business-primary-color"
                        value="#e63946"
                    >
                </div>

            </div>

            <section class="preview-section">

                <h2>Así se verá tu página</h2>

                <div
                    id="business-preview"
                    class="business-preview"
                >

                    <div class="preview-hero">

                        <img
                            id="preview-cover"
                            src=""
                            alt="Portada de tu negocio"
                            class="preview-cover"
                            style="display: none;"
                        >

                        <img
                            id="preview-logo"
                            src=""
                            alt="Logo de tu negocio"
                            class="preview-logo"
                        >

                    </div>

                    <h3
                        id="preview-business-name"
                        class="preview-business-name"
                    >
                        Tu negocio
                    </h3>

                    <p
                        id="preview-welcome-message"
                        class="preview-welcome-message"
                    >
                    </p>

                    <p
                        id="preview-address"
                        class="preview-address"
                    >
                    </p>

                    

                    <div class="preview-products">

                        <div class="preview-product">
                            🍕 Producto
                        </div>

                        <div class="preview-product">
                            🥤 Bebidas
                        </div>

                        <div class="preview-product">
                            🍰 Postres
                        </div>

                    </div>

                </div>

            </section>

            <div class="onboarding-actions">

                <button
                    type="button"
                    id="btn-back"
                    class="btn-secondary"
                >
                    Atrás
                </button>

                <button
                    type="button"
                    id="btn-finish"
                    class="btn-primary"
                >
                    Finalizar
                </button>

            </div>

            <p id="onboarding-error"></p>

        </section>

    </main>

    <script
        type="module"
        src="../../js/onboarding/onboarding-color.js">
    </script>

</body>

</html>
